plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.rekijan.initiativetracker'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        // 1.x shipped as two flavors; the ".night" listing is the one that stayed on Play,
        // so 2.0 keeps its ID (and with it the users' saved data)
        applicationId "com.rekijan.initiativetracker.night"
        minSdk 27
        targetSdk 37
        versionCode 35
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Upload key, read from the REKIJAN_UPLOAD_* Gradle properties. Only set up when they exist,
    // so a debug build also works on a machine without them.
    signingConfigs {
        if (project.hasProperty("REKIJAN_UPLOAD_STORE_FILE")) {
            release {
                storeFile file(project.property("REKIJAN_UPLOAD_STORE_FILE"))
                storePassword project.findProperty("REKIJAN_UPLOAD_STORE_PASSWORD")
                keyAlias project.property("REKIJAN_UPLOAD_KEY_ALIAS")
                keyPassword project.findProperty("REKIJAN_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            if (project.hasProperty("REKIJAN_UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.gson
    implementation libs.billing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
